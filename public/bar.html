<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bar — Drinks Menu · Aurelia Hotel</title>
<meta name="description" content="See what's available at Aurelia Hotel's bar in Douala — whiskey, champagne, beer and juice. Served on-site by our bar staff.">
<link rel="canonical" href="https://aureliahotel.com/bar.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .drink-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px}
  .drink-card{overflow:hidden}
  .drink-card img{width:100%; height:150px; object-fit:cover; display:block}
  .drink-card-body{padding:14px}
  .category-tabs{display:flex; gap:8px; flex-wrap:wrap; margin:24px 0}
  .category-tabs button{padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:var(--paper); font-size:.85rem; font-weight:600; cursor:pointer}
  .category-tabs button.active{background:var(--forest); color:#fff; border-color:var(--forest)}
  @media(max-width:900px){.drink-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app-header"></div>

<section class="hero" style="min-height:340px">
  <div class="hero-media"><img src="https://picsum.photos/seed/aurelia-bar-hero/1600/700" alt="Aurelia Hotel bar" loading="eager"></div>
  <div class="container hero-inner" style="padding-top:80px">
    <span class="eyebrow" style="color:#EAF2EE">The Bar</span>
    <h1 style="color:#fff">Whiskey, champagne, beer & juice</h1>
    <p style="color:#EAF2EE; max-width:560px">Served on-site by our bar staff — see what's available below, then visit the bar to order in person.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="category-tabs" id="categoryTabs">
      <button class="active" data-cat="all">All</button>
      <button data-cat="Whiskey">Whiskey</button>
      <button data-cat="Champagne">Champagne</button>
      <button data-cat="Beer">Beer</button>
      <button data-cat="Juice">Juice</button>
    </div>
    <div class="drink-grid" id="drinkGrid">
      <div class="skeleton" style="height:230px"></div>
      <div class="skeleton" style="height:230px"></div>
      <div class="skeleton" style="height:230px"></div>
      <div class="skeleton" style="height:230px"></div>
    </div>
    <p class="form-note" style="margin-top:20px">Drinks are sold by our bar staff on-site only — online ordering isn't available for the bar.</p>
  </div>
</section>

<div id="app-footer"></div>

<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
let allDrinks = [];
document.addEventListener("firebase-ready", load);
if (window.firebaseDb) load();
function load() {
  const { collection, onSnapshot } = window.fb;
  onSnapshot(collection(window.firebaseDb, "barInventory"), (snap) => {
    allDrinks = snap.docs.map((d) => d.data());
    render("all");
  });
}
function render(cat) {
  const grid = document.getElementById("drinkGrid");
  const drinks = cat === "all" ? allDrinks : allDrinks.filter((d) => d.category === cat);
  grid.innerHTML = drinks.length ? drinks.map((d) => `
    <div class="card drink-card">
      <img src="https://picsum.photos/seed/drink-${encodeURIComponent(d.brand)}/400/300" alt="${d.brand}" loading="lazy">
      <div class="drink-card-body">
        <span class="eyebrow">${d.category}</span>
        <h3 style="margin:4px 0 6px; font-size:1rem">${d.brand}</h3>
        <div>${Number(d.quantity) > 0 ? Utils.statusChip("available").outerHTML : Utils.statusChip("outoforder").outerHTML}</div>
        <div style="margin-top:8px; font-weight:700; color:var(--forest-2)">${Utils.formatMoney(d.unitPrice)}</div>
      </div>
    </div>`).join("") : `<div class="empty-state" style="grid-column:1/-1">Our drinks list will appear here once added in the admin panel (Bar → Inventory).</div>`;
}
document.getElementById("categoryTabs").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-cat]");
  if (!btn) return;
  document.querySelectorAll("#categoryTabs button").forEach((b) => b.classList.remove("active"));
  btn.classList.add("active");
  render(btn.dataset.cat);
});
</script>
</body>
</html>

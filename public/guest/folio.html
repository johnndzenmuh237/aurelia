<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Folio · My Aurelia</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/guest.css">
</head>
<body>
<div id="app-header"></div>
<main class="guest-shell">
  <div class="guest-tabs" id="guest-tabs"></div>
  <h1 style="font-size:1.6rem">Active Folio</h1>
  
    <div class="panel"><div class="panel-head"><h3>Charges</h3></div>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>Item</th><th>Category</th><th>Amount</th></tr></thead>
      <tbody id="folioBody"><tr><td colspan="3"><div class="empty-state">Loading…</div></td></tr></tbody></table></div>
    </div>

</main>
<div id="app-footer"></div>
<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/guest-layout.js"></script>

<script>
Auth.onReady((user) => {
  if (!user) return;
  const { collection, query, where, onSnapshot } = window.fb;
  onSnapshot(query(collection(window.firebaseDb, "reservations"), where("guestUid", "==", user.uid), where("status", "==", "Checked In")), (snap) => {
    const active = snap.docs[0]?.data();
    if (!active) { document.getElementById("folioBody").innerHTML = `<tr><td colspan="3"><div class="empty-state">No active stay right now.</div></td></tr>`; return; }
    onSnapshot(query(collection(window.firebaseDb, "folioItems"), where("reservationId", "==", snap.docs[0].id)), (itemsSnap) => {
      const items = itemsSnap.docs.map((d) => d.data());
      document.getElementById("folioBody").innerHTML = items.length ? items.map((it) => `<tr><td>${it.description||it.category}</td><td>${it.category}</td><td>${Utils.formatMoney(it.amount)}</td></tr>`).join("")
        : `<tr><td colspan="3"><div class="empty-state">No charges posted yet.</div></td></tr>`;
    });
  });
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Reservations · My Aurelia</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/guest.css">
</head>
<body>
<div id="app-header"></div>
<main class="guest-shell">
  <div class="guest-tabs" id="guest-tabs"></div>
  <h1 style="font-size:1.6rem">My Reservations</h1>
  
    <div class="panel"><div class="table-wrap"><table class="data-table">
      <thead><tr><th>Reservation</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Balance</th><th>Status</th></tr></thead>
      <tbody id="gAllRes"><tr><td colspan="6"><div class="empty-state">Loading…</div></td></tr></tbody>
    </table></div></div>

</main>
<div id="app-footer"></div>
<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/guest-layout.js"></script>

<script>
Auth.onReady((user) => {
  if (!user) return;
  const { collection, query, where, onSnapshot } = window.fb;
  onSnapshot(query(collection(window.firebaseDb, "reservations"), where("guestUid", "==", user.uid)), (snap) => {
    const rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    document.getElementById("gAllRes").innerHTML = rows.length ? rows.map((r) => `
      <tr><td><a href="/guest/reservation-details.html?id=${r.id}" style="font-family:var(--font-mono); color:var(--forest)">${r.reservationCode || r.id}</a></td>
      <td>${r.room||"—"}</td><td>${Utils.formatDate(r.checkIn)}</td><td>${Utils.formatDate(r.checkOut)}</td>
      <td>${Utils.formatMoney(r.balance)}</td><td>${Utils.statusChip(r.status||"pending").outerHTML}</td></tr>`).join("")
      : `<tr><td colspan="6"><div class="empty-state">No reservations yet. <a href="/rooms.html">Book a room →</a></div></td></tr>`;
  });
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservation Details · My Aurelia</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/guest.css">
</head>
<body>
<div id="app-header"></div>
<main class="guest-shell">
  <div class="guest-tabs" id="guest-tabs"></div>
  <h1 style="font-size:1.6rem">Reservation Details</h1>
  
    <div class="panel" id="detailPanel"><div class="panel-body"><div class="skeleton" style="height:160px"></div></div></div>

</main>
<div id="app-footer"></div>
<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/guest-layout.js"></script>

<script>
const resId = Utils.qs("id");
Auth.onReady((user) => {
  if (!user || !resId) return;
  const { doc, onSnapshot } = window.fb;
  onSnapshot(doc(window.firebaseDb, "reservations", resId), (snap) => {
    if (!snap.exists()) { document.getElementById("detailPanel").innerHTML = `<div class="panel-body"><div class="empty-state">Reservation not found.</div></div>`; return; }
    const r = snap.data();
    document.getElementById("detailPanel").innerHTML = `<div class="panel-body">
      <p><strong>Reservation:</strong> ${r.reservationCode || resId}</p>
      <p><strong>Room:</strong> ${r.room || "Unassigned"} (${r.roomTypeName || ""})</p>
      <p><strong>Dates:</strong> ${Utils.formatDate(r.checkIn)} → ${Utils.formatDate(r.checkOut)}</p>
      <p><strong>Status:</strong> ${Utils.statusChip(r.status||"pending").outerHTML}</p>
      <p><strong>Total:</strong> ${Utils.formatMoney(r.total)} · <strong>Balance:</strong> ${Utils.formatMoney(r.balance)}</p>
      ${r.specialRequests ? `<p><strong>Special requests:</strong> ${r.specialRequests}</p>` : ""}
    </div>`;
  });
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account & Security · Aurelia PMS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#163A30">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script src="/js/icons.js"></script>
</head>
<body>
<div id="admin-shell" data-title="My Account & Security" data-roles="">
  <div id="admin-content">

    <div id="force" class="alert alert-info hidden"><i data-icon="lock" data-size="18"></i><span><b>Choose your own password</b> before you continue. The temporary one you were given can no longer be used.</span></div>
    <div class="two-col">
      <div class="panel"><div class="panel-head"><h3>Profile</h3></div><div class="panel-body" id="profile"></div></div>
      <div class="panel"><div class="panel-head"><h3>Change password</h3></div><div class="panel-body">
        <div id="pwNote" class="muted" style="font-size:.86rem;margin-bottom:12px">Changing your password signs you out of every other device.</div>
        <form id="pwForm" novalidate><div id="pwFields"></div><div class="alert alert-error hidden" id="pwErr" role="alert"></div><button class="btn btn-primary" type="submit">Update password</button></form></div></div>
    </div>
    <div class="panel"><div class="panel-head"><h3>This device</h3></div><div class="panel-body">
      <p class="muted" style="margin-top:0">Install the app for a faster, full-screen experience.</p>
      <button class="btn btn-gold" data-install-btn hidden><i data-icon="download" data-size="16"></i> Install app</button>
      <p class="muted" id="installNote" style="margin:0;font-size:.86rem"></p>
      <div style="margin-top:14px"><button class="btn btn-outline" id="signout"><i data-icon="log-out" data-size="16"></i> Sign out</button></div></div></div>
  </div>
</div>
<script src="/js/config.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/portal-ui.js"></script>
<script src="/js/admin-nav-data.js"></script>
<script src="/js/admin-page-roles.js"></script>
<script src="/js/admin-layout.js"></script>
<script>
document.addEventListener("shell-ready", function () {

  const $ = (id) => document.getElementById(id), esc = PortalUI.esc;
  const s = Auth.getSession();
  if (new URLSearchParams(location.search).get("force") || s.mustChangePassword) $("force").classList.remove("hidden");
  $("profile").innerHTML = `<dl style="display:grid;grid-template-columns:120px 1fr;gap:10px 14px;margin:0;font-size:.9rem"><dt class="muted">Name</dt><dd style="margin:0">${esc(s.name)}</dd><dt class="muted">Role</dt><dd style="margin:0">${esc(Auth.roleLabel())}</dd>
    ${s.email ? `<dt class="muted">Email</dt><dd style="margin:0">${esc(s.email)}</dd>` : ""}${(s.departments || []).length ? `<dt class="muted">Departments</dt><dd style="margin:0">${s.departments.map(d => esc(Auth.DEPARTMENTS[d])).join(", ")}</dd>` : ""}
    ${s.accountId ? `<dt class="muted">Permissions</dt><dd style="margin:0">${(s.permissions || []).join(", ") || "Full authority"}</dd>` : ""}</dl>`;
  if (!s.accountId) {
    $("pwForm").classList.add("hidden");
    $("pwNote").innerHTML = "You sign in with your team's shared password, which is managed by the manager. Personal passwords are available for owner and manager accounts.";
  } else {
    $("pwFields").innerHTML = PortalUI.passwordField({ name: "currentPassword", label: "Current password", autocomplete: "current-password" }) +
      PortalUI.passwordField({ name: "newPassword", label: "New password", meter: true, hint: "At least 10 characters with upper case, lower case and a number." }) + PortalUI.passwordField({ name: "confirmPassword", label: "Confirm new password" });
    PortalUI.wirePasswords($("pwForm"));
  }
  $("pwForm").addEventListener("submit", async (e) => {
    e.preventDefault(); const err = $("pwErr"); err.classList.add("hidden");
    const d = PortalUI.formData(e.target);
    const fail = (m) => { err.textContent = m; err.classList.remove("hidden"); };
    if (d.newPassword !== d.confirmPassword) return fail("The two new passwords do not match.");
    try {
      const r = await Utils.api("/account/change-password", { method: "POST", body: d });
      Auth.replaceSession(r); Utils.toast("Password updated.", "success");
      setTimeout(() => location.href = Auth.homeFor(), 900);
    } catch (ex) { fail(ex.message); }
  });
  $("signout").addEventListener("click", () => Auth.logout());
  $("installNote").textContent = window.AureliaInstall && AureliaInstall.standalone() ? "This app is installed on this device." : "";

  Icons.hydrate(document);
});
</script>
<script src="/js/app-core.js"></script>
</body>
</html>

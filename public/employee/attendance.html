<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Attendance · Aurelia Staff</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/employee.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#163A30">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script src="/js/icons.js"></script>
</head>
<body>
<div id="app-header"></div>
<main class="guest-shell">
  <div class="guest-tabs" id="emp-tabs"></div>
  <h1 style="font-size:1.6rem">My Attendance</h1>
  
    <div class="panel"><div class="table-wrap"><table class="data-table">
      <thead><tr><th>Date</th><th>Check In</th><th>Check Out</th><th>Status</th></tr></thead>
      <tbody id="attBody"><tr><td colspan="4"><div class="empty-state">Loading…</div></td></tr></tbody>
    </table></div></div>

</main>
<div id="app-footer"></div>
<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/employee-layout.js"></script>

<script>
Auth.onReady((user, profile) => {
  if (!user) return;
  const empId = profile?.fullName || user.uid;
  Utils.pollCollection("employeeAttendance", (all) => {
    const rows = all.filter((r) => r.employeeId === empId);
    document.getElementById("attBody").innerHTML = rows.length ? rows.map((r) => `
      <tr><td>${Utils.formatDate(r.date)}</td><td>${r.checkIn||"—"}</td><td>${r.checkOut||"—"}</td><td>${Utils.statusChip(r.status||"present").outerHTML}</td></tr>`).join("")
      : `<tr><td colspan="4"><div class="empty-state">No attendance records yet.</div></td></tr>`;
  });
});
</script>

<script src="/js/app-core.js"></script>
</body>
</html>

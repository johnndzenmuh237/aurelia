<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Schedule · Aurelia Staff</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/employee.css">
</head>
<body>
<div id="app-header"></div>
<main class="guest-shell">
  <div class="guest-tabs" id="emp-tabs"></div>
  <h1 style="font-size:1.6rem">My Schedule</h1>
  
    <div class="panel"><div class="table-wrap"><table class="data-table">
      <thead><tr><th>Day</th><th>Shift</th><th>Department</th></tr></thead>
      <tbody id="schBody"><tr><td colspan="3"><div class="empty-state">Loading…</div></td></tr></tbody>
    </table></div></div>

</main>
<div id="app-footer"></div>
<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/employee-layout.js"></script>

<script>
Auth.onReady((user, profile) => {
  if (!user) return;
  const empId = profile?.fullName || user.uid;
  Utils.pollCollection("schedules", (all) => {
    const rows = all.filter((r) => r.employeeId === empId);
    document.getElementById("schBody").innerHTML = rows.length ? rows.map((r) => `<tr><td>${r.day}</td><td>${r.shift}</td><td>${r.department||"—"}</td></tr>`).join("")
      : `<tr><td colspan="3"><div class="empty-state">No shifts scheduled yet.</div></td></tr>`;
  });
});
</script>

</body>
</html>

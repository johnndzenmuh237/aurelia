<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard · Aurelia Staff</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/employee.css">
</head>
<body>
<div id="app-header"></div>
<main class="guest-shell">
  <div class="guest-tabs" id="emp-tabs"></div>
  <h1 style="font-size:1.6rem">My Dashboard</h1>
  
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-card"><div class="stat-label">Today's Status</div><div class="stat-value" id="eStatus" style="font-size:1.1rem">–</div></div>
      <div class="stat-card"><div class="stat-label">Open Tasks</div><div class="stat-value" id="eTasks">–</div></div>
      <div class="stat-card"><div class="stat-label">This Week's Shifts</div><div class="stat-value" id="eShifts">–</div></div>
    </div>
    <div class="panel" style="padding:20px">
      <button class="btn btn-primary" id="clockBtn">Mark Present</button>
    </div>

</main>
<div id="app-footer"></div>
<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/employee-layout.js"></script>

<script>
let empId = null;
Auth.onReady(async (user, profile) => {
  if (!user) return;
  empId = profile?.fullName || user.uid;
  const todayStr = new Date().toISOString().slice(0,10);
  Utils.pollCollection("employeeAttendance", (rows) => {
    const rec = rows.find((r) => r.employeeId === empId && r.date === todayStr);
    document.getElementById("eStatus").textContent = rec ? (rec.checkOut ? "Clocked out" : "Clocked in") : "Not clocked in";
    document.getElementById("clockBtn").textContent = rec && !rec.checkOut ? "Clock Out" : "Mark Present";
  });
  Utils.pollCollection("housekeepingTasks", (rows) => {
    document.getElementById("eTasks").textContent = rows.filter((t) => t.assignedTo === empId && t.status !== "completed").length;
  });
});
document.getElementById("clockBtn").addEventListener("click", async () => {
  try {
    const isOut = document.getElementById("clockBtn").textContent === "Clock Out";
    await Utils.api("/employees/attendance", { method: "POST", body: { employeeId: empId, action: isOut ? "clock_out" : "clock_in" } });
    Utils.toast(isOut ? "Clocked out" : "Clocked in", "success");
  } catch (err) { Utils.toast(err.message, "error"); }
});
</script>

</body>
</html>

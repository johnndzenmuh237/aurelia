<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account · Aurelia Hotel</title>
<meta name="description" content="Create a guest account at Aurelia Hotel to manage bookings, bills and requests online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div id="app-header"></div>
<main class="auth-shell">
  <div class="auth-card card">
    <h1 style="font-size:1.8rem">Create your account</h1>
    <p class="muted">Book faster next time and manage your stay online.</p>
    <form id="registerForm">
      <div class="field"><label>Full Name</label><input type="text" name="fullName" required></div>
      <div class="field"><label>Email</label><input type="email" name="email" required></div>
      <div class="field"><label>Phone</label><input type="tel" name="phone" required></div>
      <div class="field"><label>Password</label><input type="password" name="password" minlength="6" required></div>
      <div class="form-error hidden" id="regError"></div>
      <button class="btn btn-primary btn-block" type="submit">Create Account</button>
    </form>
    <p class="muted" style="margin-top:16px; text-align:center">Already have an account? <a href="/login.html" style="color:var(--forest); font-weight:600">Sign in</a></p>
  </div>
</main>
<div id="app-footer"></div>
<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const errorBox = document.getElementById("regError");
  errorBox.classList.add("hidden");
  try {
    await Auth.register(Object.fromEntries(fd.entries()));
    window.location.href = "/guest/dashboard.html";
  } catch (err) {
    errorBox.textContent = err.message || "Could not create your account. Please try again.";
    errorBox.classList.remove("hidden");
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departures Today · Aurelia PMS Admin</title><meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div id="admin-shell" data-title="Departures Today" data-roles="super_admin,manager,front_desk">
  <div id="admin-content">
    <div class="panel">
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>Guest</th><th>Room</th><th>Outstanding Balance</th><th>Folio</th><th></th></tr></thead>
        <tbody id="depBody">${""}</tbody>
      </table></div>
    </div>
  </div>
</div>
<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin-nav-data.js"></script>
<script src="/js/admin-layout.js"></script>
<script>
document.getElementById("depBody").innerHTML = Utils.skeletonRows(4, 5);
document.addEventListener("firebase-ready", sub);
if (window.firebaseDb) sub();
function sub() {
  const { collection, query, where, onSnapshot } = window.fb;
  const todayStr = new Date().toISOString().slice(0,10);
  onSnapshot(query(collection(window.firebaseDb, "reservations"), where("checkOut", "==", todayStr)), (snap) => {
    const rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    const body = document.getElementById("depBody");
    body.innerHTML = rows.length ? rows.map((r) => `
      <tr>
        <td>${r.guestName || "—"}</td>
        <td>${r.room || "—"}</td>
        <td>${Utils.formatMoney(r.balance)}</td>
        <td>${Utils.statusChip(r.folioStatus || "active").outerHTML}</td>
        <td>${r.status === "Checked In" ? `<button class="btn btn-sm btn-gold" data-id="${r.id}" ${Number(r.balance) > 0 ? "" : ""}>Check Out</button>` : Utils.statusChip(r.status || "checkedout").outerHTML}</td>
      </tr>`).join("") : `<tr><td colspan="5"><div class="empty-state">No departures scheduled for today.</div></td></tr>`;
    body.querySelectorAll("[data-id]").forEach((b) => b.addEventListener("click", async () => {
      try { await Utils.api("/checkout", { method: "POST", body: { reservationId: b.dataset.id } }); Utils.toast("Checked out — folio closed", "success"); }
      catch (err) { Utils.toast(err.message, "error"); }
    }));
  });
}
</script>
</body>
</html>

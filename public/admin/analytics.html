<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics · Aurelia PMS Admin</title><meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div id="admin-shell" data-title="Analytics" data-roles="super_admin,manager,accountant">
  <div id="admin-content">
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Avg. Length of Stay</div><div class="stat-value" id="statAlos">–</div></div>
      <div class="stat-card"><div class="stat-label">Cancellation Rate</div><div class="stat-value" id="statCancel">–</div></div>
      <div class="stat-card"><div class="stat-label">No-Show Rate</div><div class="stat-value" id="statNoshow">–</div></div>
      <div class="stat-card"><div class="stat-label">Repeat Guest Rate</div><div class="stat-value" id="statRepeat">–</div></div>
    </div>
    <div class="panel"><div class="panel-head"><h3>Bookings by Source</h3></div>
      <div class="panel-body"><div id="sourceBars"></div></div>
    </div>
  </div>
</div>
<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin-nav-data.js"></script>
<script src="/js/admin-layout.js"></script>
<script>
function load() {
  Utils.pollCollection("reservations", (all) => {
    if (!all.length) {
      document.getElementById("sourceBars").innerHTML = `<div class="empty-state">No reservation history yet — analytics will populate as bookings come in.</div>`;
      return;
    }
    const nights = all.map((r) => Utils.nightsBetween(r.checkIn, r.checkOut));
    document.getElementById("statAlos").textContent = (nights.reduce((a, b) => a + b, 0) / nights.length).toFixed(1) + " nights";
    document.getElementById("statCancel").textContent = pct(all, (r) => r.status === "Cancelled");
    document.getElementById("statNoshow").textContent = pct(all, (r) => r.status === "No Show");
    const guestCounts = {};
    all.forEach((r) => { guestCounts[r.guestName] = (guestCounts[r.guestName] || 0) + 1; });
    const repeat = Object.values(guestCounts).filter((c) => c > 1).length;
    document.getElementById("statRepeat").textContent = pctRaw(repeat, Object.keys(guestCounts).length);

    const bySource = {};
    all.forEach((r) => { const s = r.source || "DIRECT"; bySource[s] = (bySource[s] || 0) + 1; });
    const max = Math.max(...Object.values(bySource));
    document.getElementById("sourceBars").innerHTML = Object.entries(bySource).map(([s, c]) => `
      <div style="margin-bottom:10px">
        <div style="display:flex; justify-content:space-between; font-size:.85rem; margin-bottom:4px"><span>${s}</span><span>${c}</span></div>
        <div style="background:var(--line); border-radius:6px; height:8px"><div style="background:var(--gold); width:${(c / max) * 100}%; height:8px; border-radius:6px"></div></div>
      </div>`).join("");
  });
  function pct(arr, fn) { return pctRaw(arr.filter(fn).length, arr.length); }
  function pctRaw(n, d) { return d ? ((n / d) * 100).toFixed(1) + "%" : "0%"; }
}
load();
</script>
</body>
</html>

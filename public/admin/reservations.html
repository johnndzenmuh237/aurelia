<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservations · Aurelia PMS Admin</title><meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div id="admin-shell" data-title="All Reservations" data-roles="super_admin,manager,front_desk,reservations">
  <div id="admin-content">
    <div class="panel">
      <div class="table-toolbar">
        <input type="search" id="resSearch" placeholder="Search by guest, reservation ID, room…" style="min-width:260px">
        <select id="resStatusFilter">
          <option value="">All statuses</option>
          <option>Pending</option><option>Confirmed</option><option>Checked In</option>
          <option>Checked Out</option><option>Cancelled</option><option>No Show</option>
        </select>
        <span class="spacer"></span>
        <a href="/admin/walk-in.html" class="btn btn-primary btn-sm">+ New Walk-in</a>
      </div>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>Reservation</th><th>Guest</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Balance</th><th>Status</th><th></th></tr></thead>
        <tbody id="resBody">${""}</tbody>
      </table></div>
    </div>
  </div>
</div>
<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin-nav-data.js"></script>
<script src="/js/admin-layout.js"></script>
<script>
let allRes = [];
document.getElementById("resBody").innerHTML = Utils.skeletonRows(6, 8);
Utils.pollCollection("reservations", (rows) => {
  allRes = rows;
  render();
});

function render() {
  const term = document.getElementById("resSearch").value.trim().toLowerCase();
  const statusFilter = document.getElementById("resStatusFilter").value;
  let rows = allRes;
  if (term) rows = rows.filter((r) => [r.reservationCode, r.guestName, r.room].some((v) => String(v || "").toLowerCase().includes(term)));
  if (statusFilter) rows = rows.filter((r) => (r.status || "").toLowerCase() === statusFilter.toLowerCase());

  const body = document.getElementById("resBody");
  body.innerHTML = rows.length ? rows.map((r) => `
    <tr>
      <td style="font-family:var(--font-mono)">${r.reservationCode || r.id}</td>
      <td>${r.guestName || "—"}</td>
      <td>${Utils.formatRoomLabel(r.room)}</td>
      <td>${Utils.formatDate(r.checkIn)}</td>
      <td>${Utils.formatDate(r.checkOut)}</td>
      <td>${Utils.formatMoney(r.balance)}</td>
      <td>${Utils.statusChip(r.status || "pending").outerHTML}</td>
      <td style="white-space:nowrap">
        ${r.status === "Confirmed" || r.status === "Pending" ? `<button class="btn btn-sm btn-primary" data-checkin="${r.id}">Check In</button>` : ""}
        ${r.status === "Checked In" ? `<button class="btn btn-sm btn-gold" data-checkout="${r.id}">Check Out</button>` : ""}
      </td>
    </tr>
  `).join("") : `<tr><td colspan="8"><div class="empty-state">No reservations match. New bookings from the public site or Walk-ins will appear here in real time.</div></td></tr>`;

  body.querySelectorAll("[data-checkin]").forEach((b) => b.addEventListener("click", () => doAction("/checkin", { reservationId: b.dataset.checkin }, "Guest checked in")));
  body.querySelectorAll("[data-checkout]").forEach((b) => b.addEventListener("click", () => doAction("/checkout", { reservationId: b.dataset.checkout }, "Guest checked out")));
}

async function doAction(path, body, okMsg) {
  try {
    await Utils.api(path, { method: "POST", body });
    Utils.toast(okMsg, "success");
  } catch (err) { Utils.toast(err.message, "error"); }
}

document.getElementById("resSearch").addEventListener("input", Utils.debounce(render, 200));
document.getElementById("resStatusFilter").addEventListener("change", render);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Orders · Aurelia PMS Admin</title><meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div id="admin-shell" data-title="Delivery Orders" data-roles="super_admin,manager,restaurant">
  <div id="admin-content">
    <div class="panel">
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>Order #</th><th>Customer</th><th>Phone</th><th>Address</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr></thead>
        <tbody id="ordersBody"><tr><td colspan="9"><div class="empty-state">Loading…</div></td></tr></tbody>
      </table></div>
    </div>
  </div>
</div>
<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin-nav-data.js"></script>
<script src="/js/admin-layout.js"></script>
<script>
Utils.pollCollection("orders", (all) => {
  const rows = all.filter((o) => o.type === "delivery").sort((a, b) => (b.createdAt?._seconds || 0) - (a.createdAt?._seconds || 0));
  const body = document.getElementById("ordersBody");
    body.innerHTML = rows.length ? rows.map((o) => `
      <tr>
        <td style="font-family:var(--font-mono)">${o.orderNumber}</td>
        <td>${o.fullName}</td>
        <td>${o.phone}</td>
        <td style="max-width:180px">${o.deliveryAddress}</td>
        <td>${(o.items || []).map((i) => `${i.quantity}× ${i.name}`).join(", ")}</td>
        <td>${Utils.formatMoney(o.total)}</td>
        <td>${Utils.statusChip(o.paymentStatus || o.status || "pending_payment").outerHTML}</td>
        <td>${Utils.statusChip(o.deliveryStatus || "pending").outerHTML}</td>
        <td>${o.deliveryStatus !== "delivered" && o.status === "paid" ? `<button class="btn btn-sm btn-primary" data-id="${o.id}" data-next="${o.deliveryStatus === "out_for_delivery" ? "delivered" : "out_for_delivery"}">${o.deliveryStatus === "out_for_delivery" ? "Mark Delivered" : "Out for Delivery"}</button>` : ""}</td>
      </tr>`).join("") : `<tr><td colspan="9"><div class="empty-state">No delivery orders yet.</div></td></tr>`;

    body.querySelectorAll("[data-id]").forEach((b) => b.addEventListener("click", async () => {
      try { await Utils.api("/restaurant/orders", { method: "PUT", body: { id: b.dataset.id, deliveryStatus: b.dataset.next } }); Utils.toast("Updated", "success"); }
      catch (err) { Utils.toast(err.message, "error"); }
    }));
});
</script>
</body>
</html>

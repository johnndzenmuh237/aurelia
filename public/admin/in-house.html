<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In-House Guests · Aurelia PMS Admin</title><meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div id="admin-shell" data-title="In-House Guests" data-roles="super_admin,manager,front_desk,housekeeping">
  <div id="admin-content">
    <div class="panel">
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>Guest</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Nights</th><th>Balance</th><th>VIP</th></tr></thead>
        <tbody id="inhouseBody">${""}</tbody>
      </table></div>
    </div>
  </div>
</div>
<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin-nav-data.js"></script>
<script src="/js/admin-layout.js"></script>
<script>
document.getElementById("inhouseBody").innerHTML = Utils.skeletonRows(4, 7);
Utils.pollCollection("reservations", (all) => {
  const rows = all.filter((r) => r.status === "Checked In");
  const body = document.getElementById("inhouseBody");
  body.innerHTML = rows.length ? rows.map((r) => `
    <tr>
      <td>${r.guestName || "—"}</td><td>${Utils.formatRoomLabel(r.room)}</td>
      <td>${Utils.formatDate(r.checkIn)}</td><td>${Utils.formatDate(r.checkOut)}</td>
      <td>${Utils.nightsBetween(r.checkIn, r.checkOut)}</td>
      <td>${Utils.formatMoney(r.balance)}</td>
      <td>${r.vip ? "★" : "—"}</td>
    </tr>`).join("") : `<tr><td colspan="7"><div class="empty-state">No guests currently in-house.</div></td></tr>`;
});
</script>
</body>
</html>

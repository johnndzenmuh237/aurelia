<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Status · Aurelia PMS Admin</title><meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/admin.css">
<style>
  .legend{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px}
  .rs-panel{cursor:pointer; transition:.1s}
  .rs-panel:hover{transform:translateY(-2px); box-shadow:var(--shadow-m)}
</style>
</head>
<body>
<div id="admin-shell" data-title="Room Status" data-roles="super_admin,manager,front_desk,housekeeping">
  <div id="admin-content">
    <div class="legend">
      <span class="chip chip-available">Available</span>
      <span class="chip chip-occupied">Occupied</span>
      <span class="chip chip-reserved">Reserved</span>
      <span class="chip chip-dirty">Dirty</span>
      <span class="chip chip-clean">Clean</span>
      <span class="chip chip-inspected">Inspected</span>
      <span class="chip chip-maintenance">Maintenance</span>
      <span class="chip chip-outoforder">Out of Order</span>
    </div>
    <div class="panel"><div class="panel-body">
      <div class="room-board" id="statusBoard"><div class="empty-state">Loading rooms…</div></div>
    </div></div>
  </div>
</div>

<dialog id="statusDialog" style="border:none; border-radius:16px; padding:24px; width:min(92vw,380px)">
  <h3 id="statusDialogTitle" style="margin-bottom:14px"></h3>
  <div class="field"><label>New Status</label>
    <select id="newStatusSelect">
      <option value="available">Available</option>
      <option value="reserved">Reserved</option>
      <option value="occupied">Occupied</option>
      <option value="dirty">Dirty</option>
      <option value="clean">Clean</option>
      <option value="inspected">Inspected</option>
      <option value="maintenance">Maintenance</option>
      <option value="outoforder">Out of Order</option>
    </select>
  </div>
  <div style="display:flex; gap:10px; margin-top:10px">
    <button class="btn btn-ghost" id="statusCancel">Cancel</button>
    <button class="btn btn-primary btn-block" id="statusSave">Update</button>
  </div>
</dialog>

<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin-nav-data.js"></script>
<script src="/js/admin-layout.js"></script>
<script>
let currentRoomId = null;
document.addEventListener("firebase-ready", subscribeRooms);
if (window.firebaseDb) subscribeRooms();

function subscribeRooms() {
  const { collection, onSnapshot } = window.fb;
  onSnapshot(collection(window.firebaseDb, "rooms"), (snap) => {
    const board = document.getElementById("statusBoard");
    const rooms = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    board.innerHTML = rooms.length ? rooms.map((r) => `
      <div class="room-tile rs-panel" data-id="${r.id}" data-num="${r.number}">
        <div class="rnum">${Utils.formatRoomLabel(r.number)}</div>
        <div class="muted" style="font-size:.72rem; margin-bottom:6px">${r.type || ""}</div>
        ${Utils.statusChip(r.status || "available").outerHTML}
      </div>`).join("") : `<div class="empty-state">No rooms yet. Add rooms from Rooms → All Rooms.</div>`;

    board.querySelectorAll(".rs-panel").forEach((tile) => tile.addEventListener("click", () => {
      currentRoomId = tile.dataset.id;
      document.getElementById("statusDialogTitle").textContent = `Room ${tile.dataset.num}`;
      document.getElementById("statusDialog").showModal();
    }));
  });
}

document.getElementById("statusCancel").addEventListener("click", () => document.getElementById("statusDialog").close());
document.getElementById("statusSave").addEventListener("click", async () => {
  const status = document.getElementById("newStatusSelect").value;
  try {
    // Server-side, this also cascades per spec §8: e.g. checkout -> dirty
    // auto-creates a housekeeping task; here staff can also set it manually.
    await Utils.api("/rooms/status", { method: "PUT", body: { id: currentRoomId, status } });
    Utils.toast("Room status updated", "success");
    document.getElementById("statusDialog").close();
  } catch (err) { Utils.toast(err.message, "error"); }
});
</script>
</body>
</html>

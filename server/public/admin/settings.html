<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings · Aurelia PMS Admin</title><meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div id="admin-shell" data-title="Settings" data-roles="super_admin">
  <div id="admin-content">
    <div class="panel" style="max-width:640px">
      <div class="panel-head"><h3>Hotel Profile</h3></div>
      <div class="panel-body">
        <form id="settingsForm">
          <div class="field"><label>Hotel Name</label><input name="hotelName" value="Aurelia Hotel"></div>
          <div class="field-row">
            <div class="field"><label>Currency</label><input name="currency" value="FCFA"></div>
            <div class="field"><label>Tax Rate (%)</label><input name="taxRate" type="number" value="10"></div>
          </div>
          <div class="field"><label>Timezone</label><input name="timezone" value="Africa/Douala"></div>
          <div class="field"><label>No-show cutoff (hours after check-in date)</label><input name="noShowCutoff" type="number" value="6"></div>
          <button type="submit" class="btn btn-primary">Save Settings</button>
        </form>
      </div>
    </div>

    <div class="panel" style="max-width:640px">
      <div class="panel-head"><h3>Payment Providers</h3></div>
      <div class="panel-body">
        <p class="form-note">Real MTN/Orange Mobile Money merchant credentials are set as server environment variables (never in this UI or in client code) — see <code>server/config/payment.js</code> and <code>.env.example</code>.</p>
        <div class="field"><label>MTN MoMo Status</label><input value="Configured via MTN_MOMO_* env vars" disabled></div>
        <div class="field"><label>Orange Money Status</label><input value="Configured via ORANGE_MONEY_* env vars" disabled></div>
      </div>
    </div>
  </div>
</div>
<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin-nav-data.js"></script>
<script src="/js/admin-layout.js"></script>
<script>
document.getElementById("settingsForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target).entries());
  try {
    await Utils.api("/reports/finance", { method: "PUT", body: { settings: body } });
    Utils.toast("Settings saved", "success");
  } catch (err) { Utils.toast(err.message, "error"); }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen · Aurelia PMS Admin</title><meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div id="admin-shell" data-title="Kitchen" data-roles="super_admin,manager,restaurant">
  <div id="admin-content">
    <div class="grid grid-4" id="kanban" style="align-items:start">
      <div><h3>New</h3><div id="col-new" class="grid" style="gap:10px"></div></div>
      <div><h3>Preparing</h3><div id="col-preparing" class="grid" style="gap:10px"></div></div>
      <div><h3>Ready</h3><div id="col-ready" class="grid" style="gap:10px"></div></div>
      <div><h3>Delivered</h3><div id="col-delivered" class="grid" style="gap:10px"></div></div>
    </div>
  </div>
</div>
<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin-nav-data.js"></script>
<script src="/js/admin-layout.js"></script>
<script>
const stages = ["new", "preparing", "ready", "delivered"];
document.addEventListener("firebase-ready", sub);
if (window.firebaseDb) sub();
function sub() {
  const { collection, onSnapshot } = window.fb;
  onSnapshot(collection(window.firebaseDb, "orders"), (snap) => {
    const orders = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    stages.forEach((s) => {
      const col = document.getElementById(`col-${s}`);
      const rows = orders.filter((o) => (o.kitchenStatus || "new") === s);
      col.innerHTML = rows.length ? rows.map((o) => `
        <div class="card" style="padding:12px">
          <strong>${o.table || o.guestName || "Order"}</strong>
          <div class="muted" style="font-size:.8rem">${(o.items || []).map((i) => i.name).join(", ")}</div>
          ${s !== "delivered" ? `<button class="btn btn-sm btn-outline" style="margin-top:8px" data-id="${o.id}" data-next="${stages[stages.indexOf(s) + 1]}">Move to ${stages[stages.indexOf(s) + 1]}</button>` : ""}
        </div>`).join("") : `<p class="muted" style="font-size:.85rem">Empty</p>`;
      col.querySelectorAll("[data-id]").forEach((b) => b.addEventListener("click", async () => {
        try { await Utils.api("/restaurant/orders", { method: "PUT", body: { id: b.dataset.id, kitchenStatus: b.dataset.next } }); }
        catch (err) { Utils.toast(err.message, "error"); }
      }));
    });
  });
}
</script>
</body>
</html>

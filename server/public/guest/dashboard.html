<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · My Aurelia</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/guest.css">
</head>
<body>
<div id="app-header"></div>
<main class="guest-shell">
  <div class="guest-tabs" id="guest-tabs"></div>
  <h1 style="font-size:1.6rem">Dashboard</h1>
  
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-card"><div class="stat-label">Upcoming Stay</div><div class="stat-value" id="gUpcoming" style="font-size:1.1rem">–</div></div>
      <div class="stat-card"><div class="stat-label">Active Folio Balance</div><div class="stat-value" id="gBalance">–</div></div>
      <div class="stat-card"><div class="stat-label">Total Stays</div><div class="stat-value" id="gStays">–</div></div>
    </div>
    <div class="panel"><div class="panel-head"><h3>Recent Reservations</h3></div>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>Reservation</th><th>Room</th><th>Dates</th><th>Status</th></tr></thead>
      <tbody id="gRecent"><tr><td colspan="4"><div class="empty-state">Loading…</div></td></tr></tbody></table></div>
    </div>

</main>
<div id="app-footer"></div>
<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/guest-layout.js"></script>

<script>
Auth.onReady(async (user) => {
  if (!user) return;
  const { collection, query, where, onSnapshot } = window.fb;
  onSnapshot(query(collection(window.firebaseDb, "reservations"), where("guestUid", "==", user.uid)), (snap) => {
    const rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    document.getElementById("gStays").textContent = rows.filter((r) => r.status === "Checked Out").length;
    const upcoming = rows.filter((r) => new Date(r.checkIn) >= new Date() && r.status !== "Cancelled").sort((a,b) => new Date(a.checkIn) - new Date(b.checkIn))[0];
    document.getElementById("gUpcoming").textContent = upcoming ? `${upcoming.room} · ${Utils.formatDate(upcoming.checkIn)}` : "None";
    const active = rows.find((r) => r.status === "Checked In");
    document.getElementById("gBalance").textContent = Utils.formatMoney(active?.balance || 0);
    document.getElementById("gRecent").innerHTML = rows.length ? rows.slice(0,5).map((r) => `
      <tr><td style="font-family:var(--font-mono)">${r.reservationCode || r.id}</td><td>${r.room||"—"}</td>
      <td>${Utils.formatDate(r.checkIn)} → ${Utils.formatDate(r.checkOut)}</td><td>${Utils.statusChip(r.status||"pending").outerHTML}</td></tr>`).join("")
      : `<tr><td colspan="4"><div class="empty-state">No reservations yet. <a href="/rooms.html">Book a room →</a></div></td></tr>`;
  });
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Careers · Aurelia Hotel</title>
<meta name="description" content="Apply to join the Aurelia Hotel team — front desk, housekeeping, restaurant, maintenance and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head><body>
<div id="app-header"></div>
<section class="section" style="padding-top:60px">
  <div class="container" style="max-width:640px">
    <span class="eyebrow">Careers</span>
    <h1>Join the team</h1>
    <p class="muted">Submitted applications go straight into our HR pipeline for review — no separate spreadsheet, no re-typing (spec §36).</p>
    <form class="card" style="padding:24px; margin-top:20px" id="applyForm">
      <div class="field-row">
        <div class="field"><label>Full Name</label><input type="text" name="fullName" required></div>
        <div class="field"><label>Phone</label><input type="tel" name="phone" required></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Email</label><input type="email" name="email" required></div>
        <div class="field"><label>Position Applying For</label>
          <select name="position" required>
            <option>Front Desk</option><option>Housekeeping</option><option>Restaurant</option>
            <option>Kitchen</option><option>Maintenance</option><option>Security</option><option>Other</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Experience / Qualifications</label><textarea name="experience" rows="4"></textarea></div>
      <button type="submit" class="btn btn-primary btn-block">Submit Application</button>
    </form>
  </div>
</section>
<div id="app-footer"></div>
<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
document.getElementById("applyForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target).entries());
  try {
    await Utils.api("/employees/applications", { method: "POST", auth: false, body });
    Utils.toast("Application submitted — we'll be in touch.", "success");
    e.target.reset();
  } catch (err) { Utils.toast(err.message, "error"); }
});
</script>
</body></html>

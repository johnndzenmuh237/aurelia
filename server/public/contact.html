<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact · Aurelia Hotel</title>
<meta name="description" content="Contact Aurelia Hotel in Douala — phone, email and address, or send us a message directly.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head><body>
<div id="app-header"></div>
<section class="section" style="padding-top:60px">
  <div class="container">
    <div class="grid" style="grid-template-columns:1fr 1fr; gap:48px">
      <div>
        <span class="eyebrow">Get In Touch</span>
        <h1>We're here to help</h1>
        <p><strong>Address</strong><br>Rue de la Paix, Douala, Cameroon</p>
        <p><strong>Phone</strong><br><a href="tel:+237600000000">+237 6 00 00 00 00</a></p>
        <p><strong>Email</strong><br><a href="mailto:reservations@aureliahotel.com">reservations@aureliahotel.com</a></p>
      </div>
      <form class="card" style="padding:24px" id="contactForm">
        <div class="field"><label>Name</label><input type="text" name="name" required></div>
        <div class="field"><label>Email</label><input type="email" name="email" required></div>
        <div class="field"><label>Message</label><textarea name="message" rows="4" required></textarea></div>
        <button class="btn btn-primary btn-block" type="submit">Send Message</button>
      </form>
    </div>
  </div>
</section>
<div id="app-footer"></div>
<script src="/js/config.js"></script>
<script type="module" src="/js/firebase.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
document.getElementById("contactForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target).entries());
  try {
    await Utils.api("/guests/create", { method: "POST", auth: false, body: { ...body, type: "contact_message" } });
    Utils.toast("Message sent — we'll reply by email shortly.", "success");
    e.target.reset();
  } catch (err) { Utils.toast(err.message, "error"); }
});
</script>
</body></html>
